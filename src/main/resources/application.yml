# Configuração do JWT
jwt:
  secret: 3k9J2+7k5f8h1L9m2Pq7Xy8Z0aBcDeFgHiJkLmNoPqRsTuVwXyZ1234567890==
  expiration: 1800000 # 30 minutos em milissegundos

# Configuração do banco de dadosa
spring:
  application:
    name: gerenciadorDeImpostos
  datasource:
    url: jdbc:postgresql://localhost:5432/impostosdb
    username: ${DATABASE_NAME:postgres}
    password: ${DATABASE_PASSWORD:123}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# Configuração de segurança
  security:
    user:
      name: admin
      password: 123


# Configurações do servidor
server:
  port: ${SERVER_PORT:8080}
